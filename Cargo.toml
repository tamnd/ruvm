[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.5.3"
edition = "2024"
rust-version = "1.85.0"
repository = "https://github.com/tamnd/ruvm"
homepage = "https://github.com/tamnd/ruvm"
authors = ["The ruvm authors"]

# Every crate in the workspace, pinned exactly. The whole workspace carries one version and moves
# together, so a crate that depends on another names it here once and uses `.workspace = true`.
[workspace.dependencies]
ruvm-accel = { version = "=0.5.3", path = "crates/accel" }

# The lint set from spec/24-workspace-layout.md. Unsafe code is where an emulator gets a guest
# escape, so the three unsafe lints are errors rather than warnings, and `cargo xtask unsafe-audit`
# adds the per crate budget on top.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"
doc_markdown = "allow"
todo = "warn"
dbg_macro = "warn"

# An emulator built at opt-level 0 is too slow to boot anything, and a test suite that takes an
# hour in debug does not get run. Dependencies and the two crates that do the heavy lifting under
# TCG are optimized, the rest of the workspace stays debuggable.
[profile.dev.package."*"]
opt-level = 2

[profile.dev.package.ruvm-jit]
opt-level = 1

[profile.dev.package.ruvm-jit-core]
opt-level = 1

[profile.dev.package.ruvm-softfloat]
opt-level = 1

# PBKDF2 is monomorphized into ruvm-crypto, and LUKS keyslots need hundreds of thousands of
# iterations, which take minutes unoptimized.
[profile.dev.package.ruvm-crypto]
opt-level = 2

# panic = "abort" is deliberate, see spec/24-workspace-layout.md. A panic inside a device model
# means an invariant broke, and unwinding across a vCPU thread that holds a device lock with guest
# state half updated does not leave a usable VM. QEMU aborts in the same place.
[profile.release]
lto = "thin"
codegen-units = 16
panic = "abort"
strip = "debuginfo"

# What the benchmarks in spec/21-performance.md measure and what release archives are built with.
[profile.dist]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.profiling]
inherits = "dist"
debug = 1
strip = "none"

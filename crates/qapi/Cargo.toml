[package]
name = "ruvm-qapi"
description = "Rust types, visitors, QMP dispatch and introspection generated from QEMU's QAPI schema."
license = "GPL-2.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[package.metadata.ruvm]
unsafe-budget = 0

[dependencies]
ruvm-base.workspace = true

[build-dependencies]
ruvm-base.workspace = true
ruvm-qapi-gen.workspace = true

[dev-dependencies]
ruvm-qapi-gen.workspace = true

[features]
# The types and commands of -display sdl.
ui-sdl = []
# The types and commands of -display gtk.
ui-gtk = []
# The types and commands of -display dbus.
ui-dbus = []
# The types of -audiodev alsa.
audio-alsa = []
# The types of -audiodev pa.
audio-pa = []
# The types of -audiodev pipewire.
audio-pipewire = []
# The types of -audiodev coreaudio, on macOS.
audio-coreaudio = []
# The types and commands of -display cocoa, which are there only on macOS.
ui-cocoa = []

[lints]
workspace = true

[package]
name = "ruvm-system"
description = "The system emulator: option parsing, machine creation, the main loop and runstates."
license = "GPL-2.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[package.metadata.ruvm]
unsafe-budget = 0

[dependencies]
ruvm-accel.workspace = true
ruvm-accel-qtest.workspace = true
ruvm-audio.workspace = true
ruvm-base.workspace = true
ruvm-block.workspace = true
ruvm-chardev.workspace = true
ruvm-firmware.workspace = true
ruvm-hostmem.workspace = true
ruvm-hw-audio.workspace = true
ruvm-hw-char.workspace = true
ruvm-hw-core.workspace = true
ruvm-hw-display.workspace = true
ruvm-hw-input.workspace = true
ruvm-hw-misc.workspace = true
ruvm-hw-pci.workspace = true
ruvm-hw-storage.workspace = true
ruvm-hw-virtio.workspace = true
ruvm-machine-arm.workspace = true
ruvm-machine-riscv.workspace = true
ruvm-machine-x86.workspace = true
ruvm-mem.workspace = true
ruvm-migration.workspace = true
ruvm-monitor.workspace = true
ruvm-net.workspace = true
ruvm-qapi.workspace = true
ruvm-qom.workspace = true
ruvm-target-arm.workspace = true
ruvm-target-riscv.workspace = true
ruvm-ui.workspace = true

[target.'cfg(unix)'.dependencies]
ruvm-sys.workspace = true

[target.'cfg(all(target_os = "linux", target_arch = "x86_64"))'.dependencies]
ruvm-accel-kvm.workspace = true

[build-dependencies]
ruvm-qapi-gen.workspace = true

[features]
# -display sdl, over the system's SDL2 library.
ui-sdl = ["ruvm-qapi/ui-sdl", "ruvm-ui/ui-sdl"]
# -display gtk, over the system's GTK 4 library.
ui-gtk = ["ruvm-qapi/ui-gtk", "ruvm-ui/ui-gtk"]
# -display dbus, over the zbus crate.
ui-dbus = ["ruvm-audio/ui-dbus", "ruvm-qapi/ui-dbus", "ruvm-ui/ui-dbus"]
# -audiodev alsa, over the system's ALSA library.
audio-alsa = ["ruvm-audio/audio-alsa", "ruvm-qapi/audio-alsa"]
# -display cocoa on macOS, over the system's AppKit.
ui-cocoa = ["ruvm-qapi/ui-cocoa", "ruvm-ui/ui-cocoa"]

[lints]
workspace = true

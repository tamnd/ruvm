[package]
name = "ruvm-cli"
description = "The ruvm multi-call binary, answering to every QEMU binary name."
license = "GPL-2.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[[bin]]
name = "ruvm"
path = "src/main.rs"

[package.metadata.ruvm]
unsafe-budget = 0

[dependencies]
ruvm-base.workspace = true
ruvm-img.workspace = true
ruvm-io.workspace = true
ruvm-linux-user.workspace = true
ruvm-nbd.workspace = true
ruvm-storage-daemon.workspace = true
ruvm-system.workspace = true

[dev-dependencies]
flate2.workspace = true
ruvm-machine-arm.workspace = true
ruvm-qapi.workspace = true
ruvm-target-arm.workspace = true

[features]
# -display sdl, over the system's SDL2 library.
ui-sdl = ["ruvm-system/ui-sdl"]
# -display gtk, over the system's GTK 4 library.
ui-gtk = ["ruvm-system/ui-gtk"]
# -display dbus, over the zbus crate.
ui-dbus = ["ruvm-system/ui-dbus"]
# -display cocoa on macOS, over the system's AppKit.
ui-cocoa = ["ruvm-system/ui-cocoa"]

[lints]
workspace = true

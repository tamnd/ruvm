[package]
name = "ruvm-net"
description = "Netdev backends: user, passt, tap, socket, stream, vhost-user and the rest, and net filters."
license = "GPL-2.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[package.metadata.ruvm]
unsafe-budget = 4

[dependencies]
ruvm-base.workspace = true
ruvm-qapi.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["event", "pipe"] }

[target.'cfg(target_os = "linux")'.dependencies]
vmm-sys-util.workspace = true

[lints]
workspace = true

[package]
name = "ruvm-net"
description = "Netdev backends: user, passt, tap, socket, stream, vhost-user and the rest, and net filters."
license = "GPL-2.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

# The unsafe items are the descriptor adoption in fd.rs, the libslirp binding in slirp/ffi.rs and
# the calls into it in slirp/, which cross into C by nature, and the fd 3 setup in passt.rs that
# runs between fork and exec. Each one carries a SAFETY comment.
[package.metadata.ruvm]
unsafe-budget = 40

[features]
default = ["slirp"]
# `-netdev user`, through libslirp loaded at run time. Without the library the backend fails with
# an error rather than the build failing.
slirp = []

[dependencies]
ruvm-base.workspace = true
ruvm-qapi.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true
rustix = { workspace = true, features = ["event", "pipe", "process"] }
ruvm-vhost.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
vmm-sys-util.workspace = true

[lints]
workspace = true

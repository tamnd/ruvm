[package]
name = "ruvm-chardev"
description = "Character device backends and the mux."
license = "GPL-2.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[package.metadata.ruvm]
# The unsafe items are the descriptor adoption in fd.rs.
unsafe-budget = 2

[dependencies]
ruvm-base.workspace = true
ruvm-qapi.workspace = true
ruvm-qom.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["event", "pty", "termios"] }

[lints]
workspace = true

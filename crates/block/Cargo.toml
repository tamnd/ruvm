[package]
name = "ruvm-block"
description = "The block layer: the graph, formats, protocols, filters, jobs and exports."
license = "GPL-2.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[package.metadata.ruvm]
# Two fcntl() calls rustix does not wrap: the byte range locks file-posix takes (OFD on Linux,
# POSIX elsewhere) and F_PUNCHHOLE on macOS. Both are in src/sys.rs.
unsafe-budget = 2

[dependencies]
libc.workspace = true
ruvm-base.workspace = true
ruvm-qapi.workspace = true

[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[lints]
workspace = true

[package]
name = "ruvm-block"
description = "The block layer: the graph, formats, protocols, filters, jobs and exports."
license = "GPL-2.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[package.metadata.ruvm]
# Calls rustix does not wrap, one unsafe block each:
# - src/sys.rs: the fcntl() byte range locks file-posix takes (OFD on Linux, POSIX elsewhere),
#   the F_PUNCHHOLE fcntl() on macOS, and ioctl() for the block device and CD-ROM requests
#   (BLKROGET, BLKSECTGET, BLKDISCARD, BLKZEROOUT, CDROM_*, DKIOCGETBLOCKSIZE/COUNT).
# - src/protocol/aio.rs: the linux-aio system calls io_setup, io_submit, io_getevents and
#   io_destroy, and pushing a submission queue entry onto an io_uring.
unsafe-budget = 8

[features]
default = ["dmg-bzip2"]
# The dmg chunk decompressors QEMU builds as the dmg-bz2 and dmg-lzfse modules. Both decoders
# are in this crate; without the feature a chunk of that kind fails with QEMU's message for a
# missing module.
dmg-bzip2 = []
dmg-lzfse = []

[dependencies]
flate2.workspace = true
libc.workspace = true
ruvm-base.workspace = true
ruvm-crypto.workspace = true
ruvm-qapi.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["param"] }

[target.'cfg(target_os = "linux")'.dependencies]
io-uring.workspace = true

[lints]
workspace = true

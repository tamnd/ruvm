ripemd.workspace = true
ruvm-base.workspace = true
ruvm-qapi.workspace = true
ruvm-qom.workspace = true
serpent.workspace = true
sha1.workspace = true
sha2.workspace = true
sm3.workspace = true
sm4.workspace = true
twofish.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["time"] }


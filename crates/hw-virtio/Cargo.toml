[package]
name = "ruvm-hw-virtio"
description = "Virtio devices and the PCI, MMIO and CCW transports."
license = "GPL-2.0-or-later"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
publish = false

[package.metadata.ruvm]
unsafe-budget = 0

[dependencies]
ruvm-base.workspace = true
ruvm-hw-core.workspace = true
ruvm-hw-pci.workspace = true
ruvm-hw-storage.workspace = true
ruvm-mem.workspace = true
ruvm-vhost.workspace = true
ruvm-virtio-queue.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { workspace = true, features = ["event"] }

[target.'cfg(unix)'.dev-dependencies]
rustix = { workspace = true, features = ["net"] }

[lints]
workspace = true

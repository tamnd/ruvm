blank_issues_enabled: true
contact_links:
  - name: Question about the design
    url: https://github.com/tamnd/ruvm/discussions
    about: The specification under spec/ is the design. If something in it does not hold up, a discussion is the right place to say so.
  - name: Security report
    url: https://github.com/tamnd/ruvm/security/advisories/new
    about: A guest that can crash ruvm, reach host memory or run code in the ruvm process under KVM, HVF or WHPX. Please do not open a public issue.
